name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      
      - name: 类型检查
        run: pnpm lint
      
      - name: 构建所有包
        run: pnpm build
      
      - name: 运行测试
        run: pnpm test
      
      - name: 验证示例配置 - all-in-one
        run: node ./packages/cli/dist/index.js doctor -f ./examples/all-in-one.yaml
      
      - name: 验证示例配置 - hybrid
        run: node ./packages/cli/dist/index.js doctor -f ./examples/hybrid.yaml
      
      - name: 验证示例配置 - split
        run: node ./packages/cli/dist/index.js doctor -f ./examples/split.yaml
      
      - name: 验证 CLI 主命令
        run: |
          node ./packages/cli/dist/index.js --help
          node ./packages/cli/dist/index.js plan -f ./examples/all-in-one.yaml
          node ./packages/cli/dist/index.js apply -f ./examples/all-in-one.yaml --dry-run
          node ./packages/cli/dist/index.js heal -f ./examples/all-in-one.yaml --dry-run
