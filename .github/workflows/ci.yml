name: CI

on:
  push:
    branches: [main, master, develop, develop-*]
  pull_request:
    branches: [main, master, develop, develop-*]

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install
      
      - name: 验证版本一致性
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          CONTROLLER_VERSION=$(node -p "require('./packages/controller/package.json').version")
          SHARED_VERSION=$(node -p "require('./packages/shared/package.json').version")
          WEB_VERSION=$(node -p "require('./packages/web/package.json').version")
          WORKER_VERSION=$(node -p "require('./packages/worker/package.json').version")
          TEMPLATES_VERSION=$(node -p "require('./packages/templates/package.json').version")
          DESKTOP_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          
          echo "版本检查:"
          echo "  root: $ROOT_VERSION"
          echo "  cli: $CLI_VERSION"
          echo "  controller: $CONTROLLER_VERSION"
          echo "  shared: $SHARED_VERSION"
          echo "  web: $WEB_VERSION"
          echo "  worker: $WORKER_VERSION"
          echo "  templates: $TEMPLATES_VERSION"
          echo "  desktop: $DESKTOP_VERSION"
          
          if [ "$ROOT_VERSION" != "$CLI_VERSION" ] || [ "$ROOT_VERSION" != "$CONTROLLER_VERSION" ] || \
             [ "$ROOT_VERSION" != "$SHARED_VERSION" ] || [ "$ROOT_VERSION" != "$WEB_VERSION" ] || \
             [ "$ROOT_VERSION" != "$WORKER_VERSION" ] || [ "$ROOT_VERSION" != "$TEMPLATES_VERSION" ] || \
             [ "$ROOT_VERSION" != "$DESKTOP_VERSION" ]; then
            echo "错误: 所有包的版本号必须一致"
            exit 1
          fi
          echo "✅ 版本号一致"
       
      - name: 构建所有包
        run: pnpm build
      
      - name: 运行测试
        run: pnpm test
      
      - name: 验证示例配置 - all-in-one
        run: node ./packages/cli/dist/index.js doctor -f ./examples/all-in-one.yaml
      
      - name: 验证示例配置 - hybrid
        run: node ./packages/cli/dist/index.js doctor -f ./examples/hybrid.yaml
      
      - name: 验证示例配置 - split
        run: node ./packages/cli/dist/index.js doctor -f ./examples/split.yaml
      
      - name: 验证 CLI 主命令
        run: |
          node ./packages/cli/dist/index.js --help
          node ./packages/cli/dist/index.js plan -f ./examples/all-in-one.yaml
          node ./packages/cli/dist/index.js apply -f ./examples/all-in-one.yaml --dry-run
          node ./packages/cli/dist/index.js heal -f ./examples/all-in-one.yaml --dry-run
