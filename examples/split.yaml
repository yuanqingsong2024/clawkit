profile:
  name: "split-production"
  version: "1.0.0"
  topology: "split"
  description: "控制面与执行面分离，适合稳定的远程执行环境"

nodes:
  control-plane:
    type: "ssh"
    host: "10.10.0.10"
    port: 22
    user: "clawkit"
    keyPath: "~/.ssh/prod-control"
    workDir: "/srv/clawkit/control"
  exec-node:
    type: "ssh"
    host: "10.10.0.21"
    port: 22
    user: "clawkit"
    keyPath: "~/.ssh/prod-worker"
    workDir: "/srv/clawkit/worker"

services:
  controller:
    node: "control-plane"
    port: 8080
    apiPrefix: "/api"
  openClaw:
    node: "control-plane"
    publicUrl: "https://openclaw.prod.example.com"

workers:
  - id: "worker-prod-1"
    node: "exec-node"
    connectMode: "pull"
    tags:
      - "prod"
      - "backend"
    projects:
      - key: "api-service"
        repoPath: "/srv/projects/api-service"
        baseBranch: "main"
        openCode:
          port: 9921
          agent: "build"
          mode: "default"
      - key: "worker-dashboard"
        repoPath: "/srv/projects/worker-dashboard"
        baseBranch: "release"
        openCode:
          port: 9922
          agent: "build"
          mode: "default"

runtime:
  promptEngine:
    mode: "template"
  memory:
    enabled: true
    provider: "postgres"
    url: "postgresql://clawkit:***@10.10.0.10:5432/clawkit"

notify:
  enabled: true
  channels:
    - "email"
    - "webhook"
  webhook: "https://hooks.example.com/clawkit/prod"
  email:
    smtp: "smtp.example.com"
    from: "clawkit@example.com"
    to:
      - "ops@example.com"

deploy:
  timeout: 900
  retryCount: 5
  healthCheck:
    enabled: true
    interval: 90
