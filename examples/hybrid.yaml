profile:
  name: "hybrid-dev-laptop"
  version: "1.0.0"
  topology: "hybrid"
  description: "云端负责控制面，本地负责执行面，适合个人开发或远程协作"

nodes:
  cloud-control:
    type: "ssh"
    host: "claw.example.com"
    port: 22
    user: "deploy"
    keyPath: "~/.ssh/id_rsa"
    workDir: "/srv/clawkit/control"
  local-dev:
    type: "local"
    workDir: "./.clawkit/local-dev"

services:
  controller:
    node: "cloud-control"
    port: 8080
    apiPrefix: "/api"
  openClaw:
    node: "cloud-control"
    publicUrl: "https://claw.example.com"
    apiKey: "replace-me"

workers:
  - id: "laptop-worker"
    node: "local-dev"
    connectMode: "pull"
    tags:
      - "local"
      - "hybrid"
    projects:
      - key: "desktop-client"
        repoPath: "/Users/dev/projects/desktop-client"
        baseBranch: "main"
        openCode:
          port: 9911
          agent: "build"
          mode: "default"

runtime:
  promptEngine:
    mode: "template"
  memory:
    enabled: true
    provider: "redis"
    url: "redis://claw.example.com:6379/0"

notify:
  enabled: true
  channels:
    - "webhook"
  webhook: "https://hooks.example.com/clawkit/hybrid"

deploy:
  timeout: 600
  retryCount: 3
  healthCheck:
    enabled: true
    interval: 60
