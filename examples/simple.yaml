# clawkit 简化配置示例
# 只需要配置项目和 OpenClaw，其他全部使用默认值

version: "2.0"

# 项目列表
projects:
  # 生产项目 - 需要确认后执行
  - key: my-production-app
    path: /path/to/production/app
    baseBranch: main
    autoExecute: false  # 需要确认
    dangerousOps:
      - delete
      - drop
      - rm -rf
      - truncate

  # 测试项目 - 自动执行
  - key: my-test-project
    path: /path/to/test/project
    baseBranch: develop
    autoExecute: true  # 自动执行
    dangerousOps: []

  # clawkit 自身项目
  - key: clawkit
    path: .
    baseBranch: main
    autoExecute: false
    dangerousOps:
      - delete
      - drop

# OpenClaw 配置
openClaw:
  url: http://127.0.0.1:18000  # 可选，用于健康检查
  webhookToken: your-webhook-token-here  # 必填

# 全局 OpenCode 配置（推荐：所有项目共享一个 OpenCode 服务）
openCodeBaseUrl: http://127.0.0.1:4096

# 可选的高级配置（不配置则使用默认值）
# controllerPort: 8787
# dataDir: ./data
